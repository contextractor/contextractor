name: build-napi

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            zig: false
          - platform: darwin-x64
            runner: macos-14
            target: x86_64-apple-darwin
            zig: false
          - platform: linux-x64-gnu
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            zig: true
          - platform: linux-arm64-gnu
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            zig: true
          - platform: win32-x64-msvc
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            zig: false

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false # no committed pnpm-lock.yaml (gitignored)

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          components: clippy, rustfmt

      - name: Install zig
        if: matrix.zig == true
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        if: matrix.zig == true
        run: cargo install cargo-zigbuild --locked

      - name: Install workspace deps
        run: pnpm install

      - name: Build native (zig)
        if: matrix.zig == true
        run: pnpm --filter @contextractor/extraction-native exec -- napi build --platform --release --target ${{ matrix.target }} --cross-compile

      - name: Build native (host)
        if: matrix.zig != true
        run: pnpm --filter @contextractor/extraction-native exec -- napi build --platform --release --target ${{ matrix.target }}

      - name: Stage prebuild
        shell: bash
        run: |
          mkdir -p packages/extraction/native/npm/${{ matrix.platform }}
          mv packages/extraction/native/contextractor-extraction-native.${{ matrix.platform }}.node \
             packages/extraction/native/npm/${{ matrix.platform }}/

      - name: Upload prebuild artifact
        uses: actions/upload-artifact@v6
        with:
          name: prebuild-${{ matrix.platform }}
          path: packages/extraction/native/npm/${{ matrix.platform }}/contextractor-extraction-native.${{ matrix.platform }}.node
          if-no-files-found: error
          retention-days: 7

  commit-prebuilds:
    name: commit-prebuilds
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          path: prebuilds
          pattern: prebuild-*
          merge-multiple: false

      - name: Stage refreshed prebuilds
        run: |
          set -euo pipefail
          for dir in prebuilds/prebuild-*; do
            platform="${dir##*prebuild-}"
            mkdir -p "packages/extraction/native/npm/${platform}"
            cp "${dir}/contextractor-extraction-native.${platform}.node" \
               "packages/extraction/native/npm/${platform}/"
          done

      - name: Open refresh PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: "ci/refresh-napi-prebuilds-${{ github.ref_name }}"
          base: main
          title: "ci: refresh napi-rs prebuilds for ${{ github.ref_name }}"
          commit-message: "ci: refresh napi-rs prebuilds for ${{ github.ref_name }}"
          body: |
            Auto-generated by `.github/workflows/build-napi.yml` on tag
            `${{ github.ref_name }}`. Replaces the committed `.node` files
            under `packages/extraction/native/npm/<platform>/`.
          add-paths: packages/extraction/native/npm/**/*.node
